# Activated with --spring.profiles.active=stub
# Swaps every external-tool-dependent pipeline stage (LLM, TTS, visual gen,
# ffmpeg assembly) for a deterministic offline implementation, so the full
# create-job -> completed pipeline can be exercised without installing
# Ollama, piper, ComfyUI, or ffmpeg.
videogen.storage.base-dir=./data-stub
videogen.tts.work-dir=./data-stub/work/audio
videogen.visual.work-dir=./data-stub/work/visual
videogen.assembly.work-dir=./data-stub/work/assembly
