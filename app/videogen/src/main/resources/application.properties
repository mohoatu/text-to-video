spring.application.name=videogen
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{jobId},%X{stage}] %logger{36} - %msg%n

# Local LLM (Ollama) used for scene planning
videogen.llm.ollama-base-url=http://localhost:11434
videogen.llm.ollama-model=qwen2.5:7b
videogen.llm.timeout-seconds=60
videogen.llm.max-attempts=2

# Local TTS (piper CLI) used for narration audio
videogen.tts.piper-executable=piper
videogen.tts.piper-model=
videogen.tts.work-dir=./data/work/audio
videogen.tts.max-attempts=2

# Local visual generation (ComfyUI). Disabled by default: falls back to a
# placeholder image so the pipeline runs end-to-end without it installed.
videogen.visual.comfyui-base-url=http://127.0.0.1:8188
videogen.visual.enabled=false
videogen.visual.work-dir=./data/work/visual
videogen.visual.timeout-seconds=30

# FFmpeg-based video assembly
videogen.assembly.ffmpeg-executable=ffmpeg
videogen.assembly.work-dir=./data/work/assembly

# Local storage for final outputs and job metadata snapshots
videogen.storage.base-dir=./data
