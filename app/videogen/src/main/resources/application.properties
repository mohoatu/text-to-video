spring.application.name=videogen
server.port=8080

# Generous limits for text-file uploads (POST /api/jobs/upload) — plain text,
# so even a long document or a handful of chapter files stays well under this.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{jobId},%X{stage}] %logger{36} - %msg%n

# Local LLM (Ollama) used for scene planning. Input can be a short prompt or a
# long document/article (inline, or uploaded via POST /api/jobs/upload); scene
# count adapts to content length between min-scenes and max-scenes.
videogen.llm.ollama-base-url=http://localhost:11434
videogen.llm.ollama-model=qwen2.5:14b
videogen.llm.timeout-seconds=180
videogen.llm.max-attempts=2
videogen.llm.context-length=8192
videogen.llm.min-scenes=3
videogen.llm.max-scenes=20

# Local TTS (piper CLI, vais1000 Vietnamese voice) used for narration audio
videogen.tts.piper-executable=piper
videogen.tts.piper-model=./models/piper/vi_VN-vais1000-medium.onnx
videogen.tts.work-dir=./data/work/audio
videogen.tts.max-attempts=2
# >1.0 slows narration down (1.15 = ~15% slower than the voice's natural pace)
videogen.tts.length-scale=1.15

# Local visual generation (ComfyUI standard SD1.5 txt2img: CheckpointLoaderSimple
# -> KSampler -> SaveImage, no custom nodes). style-prefix/negative-prompt below
# are only the DEFAULT drawing style, used when a job doesn't specify its own —
# pass "style" on POST /api/jobs (e.g. "anime", "flat-comic", "ink-wash", or any
# free-form English style description) to override it per request; see
# VisualStylePreset for the built-in presets. The base SD1.5 checkpoint handles
# these styles well with the right prompt, no dedicated style checkpoint needed,
# and a plain SD1.5 checkpoint without a motion module follows the scene's
# visual prompt far more faithfully than the earlier AnimateDiff-based approach
# did. Each still takes ~30s on M1 Pro MPS instead of several minutes per scene.
# Falls back to a plain placeholder image whenever ComfyUI is disabled,
# unreachable, or a generation fails/times out, so the pipeline always completes.
videogen.visual.comfyui-base-url=http://127.0.0.1:8188
videogen.visual.enabled=true
videogen.visual.work-dir=./data/work/visual
videogen.visual.timeout-seconds=30
videogen.visual.checkpoint-name=v1-5-pruned-emaonly.safetensors
videogen.visual.style-prefix=anime manga style illustration, like Naruto or Dragon Ball Z, cel shaded, bold ink outlines, vibrant anime colors, dynamic composition
videogen.visual.negative-prompt=photorealistic, realistic, 3d render, photography, western comic, blurry, low quality, watermark, text, signature, extra limbs, deformed, noisy, grainy
videogen.visual.image-width=768
videogen.visual.image-height=512
videogen.visual.steps=25
videogen.visual.cfg=9.0
videogen.visual.generation-timeout-seconds=180
videogen.visual.poll-interval-millis=1000

# FFmpeg-based video assembly
videogen.assembly.ffmpeg-executable=ffmpeg
videogen.assembly.work-dir=./data/work/assembly

# Local storage for final outputs and job metadata snapshots
videogen.storage.base-dir=./data

# Appended as an extra scene after planning so every video has a deliberate
# ending instead of cutting off right after the last line, plus a final
# fade-to-black over the last fade-out-seconds of the video.
# NOTE: narration-text is intentionally NOT set here — java.util.Properties
# (the format backing this file) only loads ISO-8859-1 by default, so the
# Vietnamese "Hết." was coming through as mojibake ("Háº¿t."). The Java
# default on VideogenProperties.Outro (compiled as UTF-8) is correct; leave
# it unset here, or switch to application.yml if it needs to be overridden.
videogen.outro.enabled=true
videogen.outro.visual-prompt="THE END" title card, bold stylized text, simple flat illustration background, clean design
videogen.outro.duration-seconds=2.5
videogen.outro.fade-out-seconds=1.0
